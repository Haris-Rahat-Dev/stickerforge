<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>StickerForge pipeline</title>
<desc>A top-down flow: upload, edit, encode to WebP, build pack, add to WhatsApp. A live estimate branches off editing and a measured spec off encoding.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.th{font-weight:500;font-size:14px;fill:#2C2C2A}
.ts{font-weight:400;font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;stroke-dasharray:4 3;fill:none}
.box{fill:#FBFAF6;stroke:#B4B2A9;stroke-width:1}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
@media (prefers-color-scheme:dark){
.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.arr{stroke:#B4B2A9}.leader{stroke:#888780}.box{fill:#2C2C2A;stroke:#5F5E5A}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#CECBF6}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#FAECE7}.c-coral .ts{fill:#F5C4B3}
}
</style>

<g class="c-purple"><rect x="60" y="60" width="260" height="54" rx="6"/>
<text class="th" x="190" y="81" text-anchor="middle" dominant-baseline="central">Upload</text>
<text class="ts" x="190" y="99" text-anchor="middle" dominant-baseline="central">probe + quality score</text></g>

<line class="arr" x1="190" y1="116" x2="190" y2="152" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="60" y="156" width="260" height="54" rx="6"/>
<text class="th" x="190" y="177" text-anchor="middle" dominant-baseline="central">Edit</text>
<text class="ts" x="190" y="195" text-anchor="middle" dominant-baseline="central">cuts, crop / fit, fps</text></g>

<line class="arr" x1="190" y1="212" x2="190" y2="248" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="60" y="252" width="260" height="54" rx="6"/>
<text class="th" x="190" y="273" text-anchor="middle" dominant-baseline="central">Encode to WebP</text>
<text class="ts" x="190" y="291" text-anchor="middle" dominant-baseline="central">512px, holds, q-ladder</text></g>

<line class="arr" x1="190" y1="308" x2="190" y2="344" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="60" y="348" width="260" height="54" rx="6"/>
<text class="th" x="190" y="369" text-anchor="middle" dominant-baseline="central">Build pack</text>
<text class="ts" x="190" y="387" text-anchor="middle" dominant-baseline="central">copy WebPs + manifest</text></g>

<line class="arr" x1="190" y1="404" x2="190" y2="440" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="60" y="444" width="260" height="54" rx="6"/>
<text class="th" x="190" y="465" text-anchor="middle" dominant-baseline="central">Add to WhatsApp</text>
<text class="ts" x="190" y="483" text-anchor="middle" dominant-baseline="central">provider serves the file</text></g>

<line class="leader" x1="320" y1="183" x2="388" y2="180"/>
<rect class="box" x="390" y="156" width="250" height="48" rx="6" stroke-dasharray="4 3"/>
<text class="th" x="515" y="174" text-anchor="middle" dominant-baseline="central">Live estimate</text>
<text class="ts" x="515" y="190" text-anchor="middle" dominant-baseline="central">fits · KB · fps · quality</text>

<line class="leader" x1="320" y1="279" x2="388" y2="276"/>
<rect class="box" x="390" y="252" width="250" height="48" rx="6" stroke-dasharray="4 3"/>
<text class="th" x="515" y="270" text-anchor="middle" dominant-baseline="central">Measured spec</text>
<text class="ts" x="515" y="286" text-anchor="middle" dominant-baseline="central">read back from the WebP</text>

<g class="c-purple"><rect x="60" y="518" width="12" height="12" rx="2"/></g>
<text class="ts" x="80" y="525" text-anchor="start" dominant-baseline="central">our server</text>
<g class="c-teal"><rect x="180" y="518" width="12" height="12" rx="2"/></g>
<text class="ts" x="200" y="525" text-anchor="start" dominant-baseline="central">editor</text>
<g class="c-coral"><rect x="270" y="518" width="12" height="12" rx="2"/></g>
<text class="ts" x="290" y="525" text-anchor="start" dominant-baseline="central">phone → WhatsApp</text>
</svg>
